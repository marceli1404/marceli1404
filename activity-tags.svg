<svg width="400" height="60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      font-size: 14px; 
      fill: #666;
    }
    .tag {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      fill: #fff;
      background: #4facfe;
      padding: 2px 8px;
      border-radius: 12px;
      margin: 2px;
      display: inline-block;
    }
    .tag-1 { 
      animation: tagPulse 3s ease-in-out infinite;
    }
    .tag-2 { 
      animation: tagPulse 3s ease-in-out 0.5s infinite;
    }
    .tag-3 { 
      animation: tagPulse 3s ease-in-out 1s infinite;
    }
    .tag-4 { 
      animation: tagPulse 3s ease-in-out 1.5s infinite;
    }
    @keyframes tagPulse {
      0%, 100% { 
        background: #4facfe;
        transform: scale(1);
      }
      50% { 
        background: #00f2fe;
        transform: scale(1.05);
      }
    }
  </style>
  <text class="label" x="10" y="20">Currently working on:</text>
  <text class="tag tag-1" x="150" y="25">AI Agents</text>
  <text class="tag tag-2" x="250" y="25">Automation</text>
  <text class="tag tag-3" x="350" y="25">Open Source</text>
  <text class="tag tag-4" x="450" y="25">Dev Tools</text>
</svg>
