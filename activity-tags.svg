<svg width="400" height="60" xmlns="http://www.w3.org/2000/svg">
  <text font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" fill="#666" x="10" y="20">Currently working on:</text>
  <text font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="12" fill="#fff" x="150" y="25">
    AI Agents
    <animate attributeName="fill" values="#4facfe;#00f2fe;#4facfe" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="12" fill="#fff" x="250" y="25">
    Automation
    <animate attributeName="fill" values="#4facfe;#00f2fe;#4facfe" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </text>
  <text font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="12" fill="#fff" x="350" y="25">
    Open Source
    <animate attributeName="fill" values="#4facfe;#00f2fe;#4facfe" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite" begin="1s"/>
  </text>
  <text font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="12" fill="#fff" x="450" y="25">
    Dev Tools
    <animate attributeName="fill" values="#4facfe;#00f2fe;#4facfe" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </text>
</svg>