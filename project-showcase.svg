<svg width="350" height="200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card { 
      fill: #1a1a1a; 
      stroke: #333; 
      stroke-width: 1;
      rx: 8;
      ry: 8;
    }
    .card-title { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #4facfe;
    }
    .card-desc {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      fill: #ccc;
    }
    .tech-tag {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 10px;
      fill: #fff;
      background: #333;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
  
  <!-- opencode-mobile Card -->
  <g class="card pulse" transform="translate(20,20)">
    <rect x="0" y="0" width="100" height="80" class="card"/>
    <text x="10" y="25" class="card-title">opencode-mobile</text>
    <text x="10" y="45" class="card-desc">Mobile UI for OpenCode AI</text>
    <text x="10" y="60" class="tech-tag">JavaScript</text>
    <text x="70" y="60" class="tech-tag">Vite</text>
    <circle cx="90" cy="15" r="3" fill="#00f2fe" class="pulse"/>
  </g>
  
  <!-- codex-zen-proxy Card -->
  <g class="card pulse" transform="translate(130,20)">
    <rect x="0" y="0" width="100" height="80" class="card"/>
    <text x="10" y="25" class="card-title">codex-zen-proxy</text>
    <text x="10" y="45" class="card-desc">AI Codex proxy</text>
    <text x="10" y="60" class="tech-tag">PowerShell</text>
    <text x="70" y="60" class="tech-tag">JavaScript</text>
    <circle cx="90" cy="15" r="3" fill="#00f2fe" class="pulse"/>
  </g>
  
  <!-- system-automation Card -->
  <g class="card pulse" transform="translate(240,20)">
    <rect x="0" y="0" width="100" height="80" class="card"/>
    <text x="10" y="25" class="card-title">system-automation</text>
    <text x="10" y="45" class="card-desc">Gmail/Puppeteer automation</text>
    <text x="10" y="60" class="tech-tag">JavaScript</text>
    <text x="70" y="60" class="tech-tag">Playwright</text>
    <circle cx="90" cy="15" r="3" fill="#00f2fe" class="pulse"/>
  </g>
</svg>
