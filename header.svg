<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marceli — AI Engineer and Open Source Developer">
  <defs>
    <linearGradient id="hSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1621"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="hName" x1="0" y1="0" x2="1" y2="0.4" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="0.55" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#7b9dff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.05 0; 0.05 0; -0.05 0" keyTimes="0;0.5;1"
        dur="12s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
        repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <style>
    .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 60px; font-weight: 800; letter-spacing: -2px; fill: url(#hName); }
    .role { font-size: 21px; font-weight: 600; letter-spacing: 0.2px; fill: #e8eef5; }
    .tag  { font-size: 14.5px; font-weight: 400; font-style: italic; fill: #8b98a9; }

    .in   { opacity: 1; }
    .rule { transform: scaleX(1); transform-box: fill-box; transform-origin: left center; }

    @media (prefers-reduced-motion: no-preference) {
      .in   { opacity: 0; animation: hRise 0.68s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .rule { transform: scaleX(0); animation: hDraw 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
      .d1 { animation-delay: 0.05s; }
      .d2 { animation-delay: 0.34s; }
      .d3 { animation-delay: 0.52s; }
    }

    @keyframes hRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes hDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <rect x="0.5" y="0.5" width="849" height="199" rx="18" fill="url(#hSurface)" stroke="#222c39"/>
  <text class="t name in d1" x="42" y="94">Marceli</text>
  <rect class="rule" x="44" y="112" width="326" height="5" rx="2.5" fill="url(#hRule)"/>
  <text class="t role in d2" x="45" y="156">AI Engineer &#160;&#183;&#160; Open Source Developer</text>
  <text class="t tag in d3" x="45" y="186">Building the future of AI-assisted development, one open source project at a time.</text>
</svg>
