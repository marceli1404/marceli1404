<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 244" width="820" height="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Marceli — builds developer tools, automation and AI-agent integrations. Stack: JavaScript, TypeScript, Node.js, PowerShell, Playwright, Cloudflare.">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#56d4dd"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-190 0" to="780 0" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="242" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="27" r="6" fill="#27c93f">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="410" y="31" text-anchor="middle" font-size="13" fill="#6e7681">marceli1404 — zsh</text>
  <line x1="1" y1="48" x2="819" y2="48" stroke="#21262d" stroke-width="1.5"/>

  <!-- line 1 -->
  <text x="36" y="91" font-size="15"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>

  <!-- hero line: static gradient name + moving sheen glint on top -->
  <text x="36" y="130" font-size="18" font-weight="700" fill="url(#nameGrad)">Marceli · developer tools, automation &amp; AI-agent integrations</text>
  <text x="36" y="130" font-size="18" font-weight="700" fill="url(#sheen)">Marceli · developer tools, automation &amp; AI-agent integrations</text>

  <!-- line 3 -->
  <text x="36" y="169" font-size="15"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">cat stack.txt</tspan></text>

  <!-- line 4 -->
  <text x="36" y="205" font-size="15" fill="#8b949e">JavaScript · TypeScript · Node.js · PowerShell · Playwright · Cloudflare</text>

  <!-- blinking cursor at end of last line -->
  <rect x="682" y="192" width="9" height="16" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
