<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 562" width="820" height="562" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Marceli — developer tools, automation and AI-agent integrations. Focus: AI coding agents (mobile UIs and proxies for OpenCode/Codex); automation with Gmail, calendar and browser flows via Playwright and Puppeteer; self-hosting and tooling with Cloudflare Workers, CLIs and dashboards. Projects: opencode-mobile (OpenCode AI agent on your phone via Codespaces), codex-zen-proxy (run OpenAI Codex on OpenCode Zen models), prism (GitHub PR dashboard on a Cloudflare Worker), system-automation (Gmail plus Playwright/Puppeteer toolkit), SteamDeck-BIOS-Fix (fix Steam Deck BIOS download failures). Stack: JavaScript, TypeScript, Node.js, PowerShell, Playwright, Cloudflare. Edinburgh, Scotland.">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#56d4dd"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-190 0" to="780 0" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="560" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="27" r="6" fill="#27c93f">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="410" y="31" text-anchor="middle" font-size="13" fill="#6e7681">marceli1404 — zsh</text>
  <line x1="1" y1="48" x2="819" y2="48" stroke="#21262d" stroke-width="1.5"/>

  <g font-size="15">
    <!-- whoami -->
    <text x="36" y="82"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>
    <text x="36" y="116" font-size="18" font-weight="700" fill="url(#nameGrad)">Marceli · developer tools, automation &amp; AI-agent integrations</text>
    <text x="36" y="116" font-size="18" font-weight="700" fill="url(#sheen)">Marceli · developer tools, automation &amp; AI-agent integrations</text>

    <!-- focus -->
    <text x="36" y="156"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">cat focus.md</tspan></text>
    <text x="36" y="184" fill="#adbac7"><tspan fill="#39d353">•</tspan> AI coding agents — mobile UIs &amp; proxies for OpenCode / Codex</text>
    <text x="36" y="210" fill="#adbac7"><tspan fill="#39d353">•</tspan> Automation — Gmail, calendar &amp; browser flows (Playwright · Puppeteer)</text>
    <text x="36" y="236" fill="#adbac7"><tspan fill="#39d353">•</tspan> Self-hosting &amp; tooling — Cloudflare Workers, CLIs &amp; dashboards</text>

    <!-- projects -->
    <text x="36" y="278"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">ls projects/</tspan></text>
    <g>
      <text x="36" y="306" fill="#56d4dd">opencode-mobile</text>    <text x="228" y="306" fill="#8b949e">OpenCode AI agent on your phone via Codespaces</text>
      <text x="36" y="332" fill="#56d4dd">codex-zen-proxy</text>    <text x="228" y="332" fill="#8b949e">Run OpenAI Codex on OpenCode Zen models</text>
      <text x="36" y="358" fill="#56d4dd">prism</text>              <text x="228" y="358" fill="#8b949e">GitHub PR dashboard on a Cloudflare Worker</text>
      <text x="36" y="384" fill="#56d4dd">system-automation</text>  <text x="228" y="384" fill="#8b949e">Gmail + Playwright / Puppeteer toolkit</text>
      <text x="36" y="410" fill="#56d4dd">SteamDeck-BIOS-Fix</text> <text x="228" y="410" fill="#8b949e">Fix Steam Deck BIOS download failures</text>
    </g>

    <!-- stack -->
    <text x="36" y="452"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> <tspan fill="#c9d1d9">cat stack.txt</tspan></text>
    <text x="36" y="480" fill="#8b949e">JavaScript · TypeScript · Node.js · PowerShell · Playwright · Cloudflare</text>

    <!-- location comment -->
    <text x="36" y="510" fill="#484f58"># Edinburgh, Scotland · exploring AI workflows, automation &amp; self-hosting</text>

    <!-- ready prompt -->
    <text x="36" y="540"><tspan fill="#39d353">➜</tspan>  <tspan fill="#58a6ff">~</tspan> </text>
  </g>

  <!-- blinking cursor at ready prompt -->
  <rect x="76" y="527" width="9" height="16" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
