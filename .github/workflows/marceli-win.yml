name: Marceli Win Windows checks
on:
  pull_request:
    paths:
      - "projects/marceli-win/**"
      - ".github/workflows/marceli-win.yml"
  workflow_dispatch:
jobs:
  windows-parse-and-dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('projects/marceli-win/MarceliWin.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Check safe preset has no side effects in preview
        shell: powershell
        run: |
          & '.\projects\marceli-win\MarceliWin.ps1' -Preset Safe -WhatIf

      - name: Smoke test Cloudflare endpoint without executing remote code
        shell: pwsh
        run: |
          $uri = 'https://win.marceli.dev/win'
          $resp = Invoke-WebRequest -Uri $uri -TimeoutSec 25 -ErrorAction Stop
          if ($resp.StatusCode -ne 200) { throw "Unexpected HTTP $($resp.StatusCode)" }
          $expected = [System.IO.File]::ReadAllText((Resolve-Path 'projects/marceli-win/MarceliWin.ps1'))
          $served = [string]$resp.Content
          $normExpected = $expected.Replace("`r`n", "`n").TrimEnd()
          $normServed = $served.Replace("`r`n", "`n").TrimEnd()
          if ($normServed -ne $normExpected) { throw 'Deployed PowerShell does not match tracked source' }
          Write-Host 'Hosted launcher matches tracked source'
