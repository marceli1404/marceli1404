<svg width="400" height="30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: #0f0;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
  <text class="text" x="0" y="20">
    Marceli is coding...
    <tspan class="cursor">_</tspan>
  </text>
</svg>
