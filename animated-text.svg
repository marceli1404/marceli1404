<svg width="400" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #4facfe;
      animation: textAnimation 2s ease-in-out infinite alternate;
    }
    @keyframes textAnimation {
      from {
        fill: #4facfe;
        transform: scale(1);
      }
      to {
        fill: #00f2fe;
        transform: scale(1.05);
      }
    }
  </style>
  <text class="text" x="0" y="30">marceli1404</text>
</svg>
