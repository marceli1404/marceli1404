<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current focus areas">
  <defs>
    <linearGradient id="fSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1621"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
  </defs>

  <style>
    .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .chipbg { fill: #16202e; stroke: #2f9bd6; stroke-opacity: 0.45; stroke-width: 1; }
    .chiptx { font-size: 14px; font-weight: 500; fill: #dbe6f2; }
    .dot    { fill: #00c2ff; }

    .chip { opacity: 1; transform: scale(1); transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: no-preference) {
      .chip { opacity: 0; transform: scale(0.9); animation: cPop 0.5s cubic-bezier(0.34, 1.45, 0.64, 1) both; }
      .c0 { animation-delay: 0.08s; }
      .c1 { animation-delay: 0.17s; }
      .c2 { animation-delay: 0.26s; }
      .c3 { animation-delay: 0.35s; }
      .c4 { animation-delay: 0.44s; }
    }

    @keyframes cPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  </style>

  <rect x="0.5" y="0.5" width="849" height="149" rx="18" fill="url(#fSurface)" stroke="#222c39"/>

  <!-- Row 1 -->
  <g transform="translate(34,30)"><g class="chip c0">
    <rect class="chipbg" x="0" y="0" width="132" height="40" rx="20"/>
    <circle class="dot" cx="22" cy="20" r="4"/>
    <text class="t chiptx" x="38" y="25">AI agents</text>
  </g></g>
  <g transform="translate(178,30)"><g class="chip c1">
    <rect class="chipbg" x="0" y="0" width="256" height="40" rx="20"/>
    <circle class="dot" cx="22" cy="20" r="4"/>
    <text class="t chiptx" x="38" y="25">Codex &#8596; open-model proxy</text>
  </g></g>
  <g transform="translate(446,30)"><g class="chip c2">
    <rect class="chipbg" x="0" y="0" width="224" height="40" rx="20"/>
    <circle class="dot" cx="22" cy="20" r="4"/>
    <text class="t chiptx" x="38" y="25">Mobile agent interfaces</text>
  </g></g>

  <!-- Row 2 -->
  <g transform="translate(34,80)"><g class="chip c3">
    <rect class="chipbg" x="0" y="0" width="268" height="40" rx="20"/>
    <circle class="dot" cx="22" cy="20" r="4"/>
    <text class="t chiptx" x="38" y="25">Browser &amp; email automation</text>
  </g></g>
  <g transform="translate(314,80)"><g class="chip c4">
    <rect class="chipbg" x="0" y="0" width="234" height="40" rx="20"/>
    <circle class="dot" cx="22" cy="20" r="4"/>
    <text class="t chiptx" x="38" y="25">Open-source dev tooling</text>
  </g></g>
</svg>
