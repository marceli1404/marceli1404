<svg width="350" height="150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; fill: #333; }
    .bar-bg { fill: #e0e0e0; }
    .bar-fill { fill: #4facfe; animation: fillBars 2s ease-in-out forwards; }
    .bar-fill-2 { fill: #00f2fe; animation: fillBars 2s ease-in-out 0.2s forwards; }
    .bar-fill-3 { fill: #43e97b; animation: fillBars 2s ease-in-out 0.4s forwards; }
    .bar-fill-4 { fill: #ffb400; animation: fillBars 2s ease-in-out 0.6s forwards; }
    .bar-fill-5 { fill: #ff006e; animation: fillBars 2s ease-in-out 0.8s forwards; }
    @keyframes fillBars {
      from { width: 0; }
      to { width: 100%; }
    }
    .value { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; fill: #333; text-anchor: end; }
  </style>
  <!-- JavaScript -->
  <text class="label" x="10" y="25">JavaScript</text>
  <rect class="bar-bg" x="120" y="15" width="200" height="12" rx="2"/>
  <rect class="bar-fill" x="120" y="15" width="0" height="12" rx="2"/>
  <text class="value" x="330" y="27">90%</text>
  
  <!-- Python -->
  <text class="label" x="10" y="50">Python</text>
  <rect class="bar-bg" x="120" y="40" width="200" height="12" rx="2"/>
  <rect class="bar-fill-2" x="120" y="40" width="0" height="12" rx="2"/>
  <text class="value" x="330" y="52">80%</text>
  
  <!-- TypeScript -->
  <text class="label" x="10" y="75">TypeScript</text>
  <rect class="bar-bg" x="120" y="65" width="200" height="12" rx="2"/>
  <rect class="bar-fill-3" x="120" y="65" width="0" height="12" rx="2"/>
  <text class="value" x="330" y="77">75%</text>
  
  <!-- PowerShell -->
  <text class="label" x="10" y="100">PowerShell</text>
  <rect class="bar-bg" x="120" y="90" width="200" height="12" rx="2"/>
  <rect class="bar-fill-4" x="120" y="90" width="0" height="12" rx="2"/>
  <text class="value" x="330" y="102">70%</text>
  
  <!-- AI/ML -->
  <text class="label" x="10" y="125">AI/ML</text>
  <rect class="bar-bg" x="120" y="115" width="200" height="12" rx="2"/>
  <rect class="bar-fill-5" x="120" y="115" width="0" height="12" rx="2"/>
  <text class="value" x="330" y="127">85%</text>
</svg>
