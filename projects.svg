<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured projects">
  <defs>
    <linearGradient id="pSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1621"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="pAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <style>
    .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cardbg { fill: #131c28; stroke: #263140; stroke-width: 1; }
    .title  { font-size: 16px; font-weight: 700; fill: #e8eef5; }
    .desc   { font-size: 12.5px; font-weight: 400; fill: #8b98a9; }
    .tagbg  { fill: #4facfe; fill-opacity: 0.16; }
    .tagtx  { font-size: 10.5px; font-weight: 700; fill: #5cc6ff; letter-spacing: 0.5px; }

    .card { opacity: 1; }

    @media (prefers-reduced-motion: no-preference) {
      .card { opacity: 0; animation: pUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .p0 { animation-delay: 0.10s; }
      .p1 { animation-delay: 0.21s; }
      .p2 { animation-delay: 0.32s; }
    }

    @keyframes pUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect x="0.5" y="0.5" width="849" height="199" rx="18" fill="url(#pSurface)" stroke="#222c39"/>

  <g transform="translate(30,26)"><g class="card p0">
    <rect class="cardbg" x="0" y="0" width="252" height="148" rx="13"/>
    <rect x="20" y="20" width="34" height="4" rx="2" fill="url(#pAccent)"/>
    <text class="t title" x="20" y="50">OpenCode Mobile</text>
    <text class="t desc" x="20" y="76">Mobile interface for the OpenCode</text>
    <text class="t desc" x="20" y="93">AI agent, driven from Codespaces.</text>
    <rect class="tagbg" x="20" y="112" width="94" height="21" rx="10.5"/>
    <text class="t tagtx" x="31" y="126">AI &#183; MOBILE</text>
  </g></g>

  <g transform="translate(299,26)"><g class="card p1">
    <rect class="cardbg" x="0" y="0" width="252" height="148" rx="13"/>
    <rect x="20" y="20" width="34" height="4" rx="2" fill="url(#pAccent)"/>
    <text class="t title" x="20" y="50">Codex Open Proxy</text>
    <text class="t desc" x="20" y="76">Proxy that lets OpenAI Codex run</text>
    <text class="t desc" x="20" y="93">against open-weight models.</text>
    <rect class="tagbg" x="20" y="112" width="110" height="21" rx="10.5"/>
    <text class="t tagtx" x="31" y="126">LLM &#183; TOOLING</text>
  </g></g>

  <g transform="translate(568,26)"><g class="card p2">
    <rect class="cardbg" x="0" y="0" width="252" height="148" rx="13"/>
    <rect x="20" y="20" width="34" height="4" rx="2" fill="url(#pAccent)"/>
    <text class="t title" x="20" y="50">Automation Suite</text>
    <text class="t desc" x="20" y="76">Browser and email workflow</text>
    <text class="t desc" x="20" y="93">automation for everyday dev tasks.</text>
    <rect class="tagbg" x="20" y="112" width="100" height="21" rx="10.5"/>
    <text class="t tagtx" x="31" y="126">AUTOMATION</text>
  </g></g>
</svg>
